<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профиль: направления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#B7E35B;text-decoration:none}a:hover{color:#CFF07F}
.num{font-family:'Inter Tight',Inter,sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A2A6AF;font-weight:600}
.dc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:#17181C;border:1px solid #2C2F35}
.st{width:36px;height:36px;border-radius:10px;border:1px solid #2C2F35;background:#202227;color:#F3F4F6;font:700 18px Inter,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:20px;background:#0E0F11;color:#F3F4F6;font-family:Inter,sans-serif;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <a href="Athlete.dc.html" style="font-size:14px;font-weight:600;color:#A2A6AF">Профиль</a>
    <span class="lbl">Направления</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <h1 class="num" style="margin:0;font-size:26px;font-weight:800;line-height:1.15">Чем вы занимаетесь</h1>
    <span style="font-size:13px;color:#A2A6AF;line-height:1.4">Неделя делится между направлениями. Для каждого настраивается свой акцент.</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Занятий в неделю</span><span class="num" style="font-size:13px;font-weight:700;color:{{totalColor}}">{{total}} из 5 дней</span></div>
    <div style="display:flex;gap:3px;height:10px" role="img" aria-label="Распределение недели по направлениям">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="5"><span style="{{s.style}}"></span></sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{items}}" as="d" hint-placeholder-count="3">
      <div class="dc">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:700;font-size:16px">{{d.title}}</span><span style="font-size:12px;color:#A2A6AF">{{d.when}}</span></span>
          <span style="display:flex;align-items:center;gap:8px"><button class="st" aria-label="Меньше" onClick="{{d.minus}}">−</button><span class="num" style="width:20px;text-align:center;font-weight:800;font-size:18px">{{d.n}}</span><button class="st" aria-label="Больше" onClick="{{d.plus}}">+</button></span>
        </div>
        <a href="{{d.href}}" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#202227;color:#F3F4F6">
          <span style="width:6px;height:6px;border-radius:3px;background:#B7E35B;flex:none"></span>
          <span style="flex:1;font-size:13px"><span style="color:#A2A6AF">{{d.focusLabel}}: </span><b>{{d.focus}}</b></span>
          <span style="font-size:12px;font-weight:600">Изменить</span>
        </a>
      </div>
    </sc-for>
  </div>

  <a href="OnSport.dc.html" style="height:44px;border-radius:12px;border:1px dashed #2C2F35;color:#A2A6AF;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center">Добавить направление</a>

  <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#202227">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#A2A6AF" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span style="font-size:12px;line-height:1.5;color:#D7D9DE">{{note}}</span>
  </div>

  <div style="margin-top:auto">
    <a href="Week.dc.html" style="height:52px;border-radius:14px;background:#B7E35B;color:#0E0F11;font:700 17px Inter,sans-serif;display:flex;align-items:center;justify-content:center">Пересчитать неделю</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { gym: 3, run: 1, yoga: 0 }; }
  renderVals() {
    const st = this.state;
    const defs = [
      { k: 'gym', title: 'Силовой зал', color: '#B7E35B', focusLabel: 'Акцент', focus: 'грудные', href: 'OnFocusM.dc.html', when: 'Пн · Ср · Пт' },
      { k: 'run', title: 'Бег', color: '#7DB3FF', focusLabel: 'Качество', focus: 'аэробная база', href: 'FocusQual.dc.html', when: 'Чт' },
      { k: 'yoga', title: 'Йога', color: '#F2B35B', focusLabel: 'Качество', focus: 'гибкость, осанка', href: 'FocusQual.dc.html', when: 'Сб' }
    ];
    const total = st.gym + st.run + st.yoga;
    const change = (k, d) => { const v = st[k] + d; if (v < 0 || v > 4) return; this.setState({ [k]: v }); };
    const items = defs.filter(d => st[d.k] > 0 || d.k !== 'yoga').map(d => ({
      title: d.title, n: st[d.k], when: st[d.k] === 0 ? 'Не в этой неделе' : d.when, focusLabel: d.focusLabel, focus: d.focus, href: d.href,
      minus: () => change(d.k, -1), plus: () => change(d.k, 1)
    }));
    if (st.yoga === 0) items.push({ title: 'Йога', n: 0, when: 'Не в этой неделе', focusLabel: 'Качество', focus: 'гибкость, осанка', href: 'FocusQual.dc.html', minus: () => change('yoga', -1), plus: () => change('yoga', 1) });
    const segs = [];
    defs.forEach(d => { for (let i = 0; i < st[d.k]; i++) segs.push({ style: 'flex:1;border-radius:5px;background:' + d.color }); });
    for (let i = total; i < 5; i++) segs.push({ style: 'flex:1;border-radius:5px;background:#2C2F35' });
    return {
      items: items.filter((x, i, a) => a.findIndex(y => y.title === x.title) === i),
      segs, total, totalColor: total > 5 ? '#F2B35B' : '#B7E35B',
      note: total > 5 ? 'Больше 5 занятий в неделю: тренер предложит убрать одно, чтобы хватало на восстановление.' : 'Тяжёлые ноги и интервальный бег не ставятся в соседние дни, лёгкий бег и йога идут в дни между силовыми.'
    };
  }
}
</script>
</body>
</html>
