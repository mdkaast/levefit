<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Питание: рецепты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#B7E35B;text-decoration:none}a:hover{color:#CFF07F}
.num{font-family:'Inter Tight',Inter,sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A2A6AF;font-weight:600}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#A2A6AF;min-width:64px;min-height:44px;justify-content:center}
.c{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid #2C2F35;background:#17181C;color:#F3F4F6;font:600 13px Inter,sans-serif;cursor:pointer}
.con{flex:none;height:34px;padding:0 13px;border-radius:17px;border:0;background:#B7E35B;color:#0E0F11;font:700 13px Inter,sans-serif;cursor:pointer}
.rc{display:flex;gap:12px;padding:10px;border-radius:16px;background:#17181C;border:1px solid #2C2F35;color:#F3F4F6}
.tg{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;background:#202227;color:#D7D9DE;font-size:11px;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E0F11;color:#F3F4F6;font-family:Inter,sans-serif;display:flex;flex-direction:column">
  <div style="flex:1;padding:24px 20px 12px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="lbl">Сегодня · 26 окт</span>
      <h1 class="num" style="margin:0;font-size:28px;font-weight:800">Питание</h1>
    </div>

    <div style="display:flex;gap:4px;padding:4px;border-radius:12px;background:#17181C">
      <a href="Nutrition.dc.html" style="flex:1;height:34px;border-radius:9px;color:#A2A6AF;font:600 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center">Дневник</a>
      <span style="flex:1;height:34px;border-radius:9px;background:#2C2F35;color:#F3F4F6;font:700 13px Inter,sans-serif;display:flex;align-items:center;justify-content:center">Рецепты</span>
    </div>

    <div style="display:flex;gap:6px;overflow:hidden;margin:0 -20px;padding:0 20px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
    </div>

    <div style="padding:10px 12px;border-radius:12px;background:#202227;font-size:12px;line-height:1.5;color:#D7D9DE">{{hint}}</div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{cards}}" as="r" hint-placeholder-count="4">
        <a href="RecipeDetail.dc.html" class="rc">
          <span style="width:64px;height:64px;border-radius:12px;background:#202227;border:1px dashed #2C2F35;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;color:#6F737B;text-align:center;line-height:1.2">[ФОТО]</span>
          <span style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
            <span style="font-weight:700;font-size:14px;line-height:1.25">{{r.name}}</span>
            <span class="num" style="font-size:12px;color:#A2A6AF">{{r.kcal}} ккал · Б {{r.p}} г · {{r.time}} мин</span>
            <span style="display:flex;gap:6px"><span class="tg" style="{{r.tagStyle}}">{{r.tag}}</span></span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav style="display:flex;justify-content:space-around;padding:8px 8px 18px;border-top:1px solid #2C2F35;background:#0E0F11">
    <a href="Today.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Сегодня</a>
    <a href="Week.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Тренировки</a>
    <a href="Nutrition.dc.html" class="tab" style="color:#B7E35B"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 002 2v8M11 3v8M7 7h4M17 3c-2 2-3 5-3 8h3v10"/></svg>Питание</a>
    <a href="Progress.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Прогресс</a>
    <a href="Athlete.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 8v8M9 11l3-3 3 3"/></svg>Атлет</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: 'you' }; }
  renderVals() {
    const chipsDef = [['you','Под вас'],['protein','Белок'],['quick','Быстро'],['pre','До тренировки'],['post','После бега'],['light','Лёгкое']];
    const R = [
      { name: 'Гречка с курицей и овощами', kcal: 520, p: 42, time: 35, tag: 'Закрывает белок', f: ['you','protein'] },
      { name: 'Творожная запеканка', kcal: 310, p: 30, time: 45, tag: 'Белок на ночь', f: ['you','protein','light'] },
      { name: 'Омлет с овощами и сыром', kcal: 380, p: 28, time: 20, tag: 'Быстро', f: ['quick','protein'] },
      { name: 'Овсянка с бананом и орехами', kcal: 430, p: 15, time: 10, tag: 'За 2 часа до зала', f: ['pre','quick'] },
      { name: 'Паста с тунцом и томатами', kcal: 560, p: 38, time: 25, tag: 'Углеводы после бега', f: ['post','protein'] },
      { name: 'Смузи с кефиром и ягодами', kcal: 240, p: 14, time: 5, tag: 'Лёгкое', f: ['quick','light','pre'] }
    ];
    const hints = {
      you: 'Осталось 963 ккал, белка не хватает 50 г. Тренировка в 18:30: перед ней лёгкие углеводы, после неё белок.',
      protein: 'Рецепты с большим количеством белка на порцию, чтобы добрать норму дня.',
      quick: 'До 25 минут приготовления.',
      pre: 'За 1,5–2 часа до тренировки: больше углеводов, меньше жира и клетчатки.',
      post: 'После бега нужны углеводы и белок. Бег в четверг по плану.',
      light: 'До 350 ккал на порцию.'
    };
    const cur = this.state.f;
    return {
      chips: chipsDef.map(([k, label]) => ({ label, cls: cur === k ? 'con' : 'c', pick: () => this.setState({ f: k }) })),
      hint: hints[cur],
      cards: R.filter(r => r.f.includes(cur)).map(r => ({ name: r.name, kcal: r.kcal, p: r.p, time: r.time, tag: r.tag, tagStyle: r.tag.includes('белок') || r.tag.includes('Белок') ? 'background:rgba(183,227,91,.14);color:#CFF07F' : '' }))
    };
  }
}
</script>
</body>
</html>
