<style>

<div style="width:390px;height:844px;box-sizing:border-box;padding:24px 20px 24px;background:#0E0F11;color:#F3F4F6;font-family:Inter,sans-serif;display:flex;flex-direction:column;gap:24px">

  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="lbl">Шаг 1 из 6</span>
    <h1 class="num" style="margin:0;font-size:28px;line-height:1.15;font-weight:800">Какие данные мы храним</h1>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#A2A6AF">Без них тренер не сможет сравнить план с фактом. Данные хранятся на серверах в России, их можно выгрузить или удалить в профиле.</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <label style="display:flex;gap:14px;padding:16px;border-radius:16px;background:#17181C;border:1px solid #2C2F35">
      <input type="checkbox" checked>
      <span style="display:flex;flex-direction:column;gap:4px">
        <span style="font-weight:600;font-size:15px">Тренировки и цели</span>
        <span style="font-size:13px;line-height:1.45;color:#A2A6AF">Упражнения, веса, повторы, оценки усилия, расписание. Обязательно для работы тренера.</span>
      </span>
    </label>
    <label style="display:flex;gap:14px;padding:16px;border-radius:16px;background:#17181C;border:1px solid #2C2F35">
      <input type="checkbox" checked>
      <span style="display:flex;flex-direction:column;gap:4px">
        <span style="font-weight:600;font-size:15px">Вес тела</span>
        <span style="font-size:13px;line-height:1.45;color:#A2A6AF">Для тренда и расчёта нагрузки в упражнениях с собственным весом. Можно отключить.</span>
      </span>
    </label>
    <label style="display:flex;gap:14px;padding:16px;border-radius:16px;background:#17181C;border:1px solid #2C2F35">
      <input type="checkbox">
      <span style="display:flex;flex-direction:column;gap:4px">
        <span style="font-weight:600;font-size:15px">Самочувствие и боль</span>
        <span style="font-size:13px;line-height:1.45;color:#A2A6AF">Это данные о здоровье — особая категория, нужно отдельное согласие. Если включить, тренер снизит нагрузку в плохой день.</span>
      </span>
    </label>
  </div>

  <a href="#" style="font-size:14px;font-weight:600">Полный текст согласия на обработку данных</a>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">

    <a href="#" style="height:48px;border-radius:14px;border:1px solid #2C2F35;color:#F3F4F6;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center">Посмотреть без сохранения</a>
