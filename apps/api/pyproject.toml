[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Длинные русские тексты причин решений
"app/engine/core.py" = ["E501"]
# Таблицы данных каталога и шаблонов: длинные строки читаются лучше, чем перенос
"app/content/*.py" = ["E501", "E741"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
