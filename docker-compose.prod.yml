# Боевой стенд Levefit: Postgres + API + бот + web. Живёт в своей сети (levefit_default),
# наружу портов не публикует: HTTPS и домены обслуживает общий прокси (infra/proxy) через сеть edge.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: levefit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOT_TOKEN: ${BOT_TOKEN}
      APP_SECRET: ${APP_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      INIT_DATA_MAX_AGE_S: ${INIT_DATA_MAX_AGE_S:-86400}
      CORS_ORIGINS: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  bot:
    build: ./apps/bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      # Версия в адресе сбрасывает кэш мобильного Telegram; при следующем сбросе меняйте номер.
      WEBAPP_URL: https://${DOMAIN}/?v=2
      API_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - api
    mem_limit: 128m

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default: {}
      edge:
        # Единственный сервис проекта, видимый общему прокси; другие проекты его имя не пересекают.
        aliases: [levefit-web]
    mem_limit: 64m

networks:
  edge:
    external: true

volumes:
  pgdata:
